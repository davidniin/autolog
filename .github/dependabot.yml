version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    # runonweb and onnxruntime-web are pinned together on purpose (see docs/en/how-it-works.md): update them by hand
    ignore:
      - dependency-name: runonweb
      - dependency-name: onnxruntime-web
    groups:
      web-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups:
      server-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
