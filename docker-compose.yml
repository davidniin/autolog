# AutoLog + its own PostgreSQL. Quick start:
#   cp .env.example .env   # fill in AUTOLOG_TOKEN and POSTGRES_PASSWORD
#   docker compose up -d --build
# The app listens on 127.0.0.1:8791 by default: put HTTPS in front of it (Tailscale, Caddy, Cloudflare Tunnel...).
# See docs/en/self-hosting.md (English) or docs/es/self-hosting.md (español).
#
# Already running PostgreSQL elsewhere? Use docker-compose.external-db.yml instead.
services:
  autolog:
    build: .
    restart: unless-stopped
    environment:
      AUTOLOG_TOKEN: ${AUTOLOG_TOKEN:?Set AUTOLOG_TOKEN in .env (openssl rand -hex 24)}
      DATABASE_URL: postgres://autolog:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/autolog
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      PUSH_HOUR: ${PUSH_HOUR:-9}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOW_NO_AUTH: ${ALLOW_NO_AUTH:-0}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8791}:8791"
    volumes:
      - autolog-data:/data # photos and PDFs (attachments)
    # Hardening: unprivileged user (in the image), read-only filesystem except /data, no Linux capabilities
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autolog
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - autolog-db:/var/lib/postgresql/data
    security_opt: [no-new-privileges:true]
    # No ports published: only the app container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autolog -d autolog"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  autolog-data:
  autolog-db:
