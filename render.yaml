# Render Blueprint: the "Deploy to Render" button in the README creates AutoLog + its PostgreSQL in your Render account.
# Security:
# - AUTOLOG_TOKEN is generated by Render (generateValue: random, 256-bit). See it in the service's Environment tab.
# - The database accepts no connections from the internet (ipAllowList: []); AutoLog reaches it on Render's private network.
# - Pinned image version; HTTPS is provided by Render; TRUST_PROXY=1 because Render's load balancer is in front.
# Costs: attachments need a persistent disk, which Render only offers on paid instances (plan: starter). Check Render's
# current prices before deploying. See docs/en/cloud.md.
services:
  - type: web
    name: autolog
    runtime: image
    image:
      url: ghcr.io/davidniin/autolog:0.5
    plan: starter
    numInstances: 1
    healthCheckPath: /v1/health
    disk:
      name: autolog-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTOLOG_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: autolog-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Europe/Madrid
      - key: PUSH_CONTACT
        sync: false

databases:
  - name: autolog-db
    databaseName: autolog
    user: autolog
    plan: basic-256mb
    ipAllowList: []
